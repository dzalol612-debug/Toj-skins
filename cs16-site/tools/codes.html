<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор промокодов</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #0b0f17; color: #e9edf7; max-width: 760px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; } h2 { font-size: 16px; margin: 22px 0 6px; }
  label { display: inline-flex; flex-direction: column; gap: 4px; margin: 0 10px 10px 0; color: #8d96ab; font-size: 13px; }
  input, textarea, button { font: inherit; color: inherit; background: #151b28; border: 1px solid #2a3347; border-radius: 8px; padding: 8px 12px; }
  textarea { width: 100%; height: 190px; font: 13px/1.5 ui-monospace, monospace; }
  button { cursor: pointer; background: #ff8a1f; color: #160a00; border: 0; font-weight: 700; }
  p { color: #8d96ab; margin: 6px 0; } .warn { color: #ff9a6b; }
</style>
</head>
<body>
<h1>Генератор промокодов</h1>
<p>Страница работает у тебя в браузере, никуда ничего не отправляет. Открывай её с компьютера, не выкладывай на сайт.</p>

<label>Монет за код <input id="coins" type="number" min="1" value="12"></label>
<label>Сколько кодов <input id="count" type="number" min="1" max="200" value="20"></label>
<button id="make" type="button">Сгенерировать</button>

<h2>1. Строки для script.js (вставь в массив PROMOCODES)</h2>
<textarea id="out-hash" readonly></textarea>

<h2>2. Коды для выдачи игрокам</h2>
<p class="warn">Храни их только у себя. Если код попадёт в чужие руки, его активирует любой.</p>
<textarea id="out-codes" readonly></textarea>

<script>
// Алфавит без похожих символов (0/O, 1/I)
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function makeCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  const chars = [...bytes].map(b => ALPHABET[b % ALPHABET.length]).join('');
  return chars.match(/.{4}/g).join('-');            // XXXX-XXXX-XXXX
}

// Должно совпадать с hashCode() в script.js: заглавные буквы и цифры, без тире
async function hashCode(code) {
  const bytes = new TextEncoder().encode(code.toUpperCase().replace(/[^A-Z0-9]/g, ''));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('make').onclick = async () => {
  const coins = Math.max(1, Math.floor(+document.getElementById('coins').value) || 1);
  const count = Math.min(200, Math.max(1, Math.floor(+document.getElementById('count').value) || 1));
  const hashes = [], codes = [];
  for (let i = 0; i < count; i++) {
    const code = makeCode();
    hashes.push(`  { hash: '${await hashCode(code)}', coins: ${coins} },`);
    codes.push(code);
  }
  document.getElementById('out-hash').value = hashes.join('\n');
  document.getElementById('out-codes').value = codes.join('\n');
};
</script>
</body>
</html>
